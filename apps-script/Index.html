/* ======================= REMINDERS (MANUAL WhatsApp) ======================= */
const MSG_HELP = { M4: 'Evening-before reminder', M7: 'Follow-up date reached', M9: 'Satisfaction survey (reply 1–5)', 'M-REM': 'Pending test reminder', 'M9-CALL': 'Survey unanswered 48h+ — care-team call fallback' };
VIEWS.reminders = async main => {
  main.innerHTML = html`<div class="row between"><h2>Patient reminders due</h2><button class="btn btn-ghost" data-act="nav" data-view="reminders">Refresh</button></div>
    <p class="muted small">Messaging mode: <b>${S.boot.cfg.MSG_MODE}</b>. ${S.boot.cfg.MSG_MODE === 'MANUAL' ? 'Click "Send on WhatsApp" — WhatsApp opens with the message ready; press send there. Each click is logged.' : 'API mode: reminders are sent automatically; this list shows anything still pending.'}</p>
    <div id="rem-list" class="card" style="padding:0"><div class="empty">Loading…</div></div>`.s;
  const r = await api('reminders', {});
  $('#rem-list').innerHTML = r.items.length ? html`<div class="list">${r.items.map(i => html`<div class="item" style="cursor:default">
      <div class="grow"><div class="row"><b>${i.name}</b><span class="chip ${i.code === 'M9-CALL' ? 'bad' : 'plum'}">${i.code === 'M9-CALL' ? 'Call' : i.code}</span><span class="muted small">${MSG_HELP[i.code] || ''}</span></div>
      <div class="small muted"><span class="lead-id">${i.leadId}</span> · ${i.clinic} · ${i.label}</div>
      ${i.text ? html`<details class="small" style="margin-top:4px"><summary>Preview message</summary><p>${i.text}</p></details>` : ''}</div>
      <div class="col" style="align-items:flex-end">${i.link ? html`<a class="btn btn-wa btn-sm" href="${i.link}" target="_blank" rel="noopener" data-act="wa-log" data-lead="${i.leadId}" data-code="${i.code}">Send on WhatsApp</a>`
        : i.code === 'M9-CALL' ? html`<a class="btn btn-sm" href="tel:${i.phone || ''}" data-act="noop">Call patient</a>` : html`<span class="chip">Opted out</span>`}
      <button class="btn-link small" data-act="open-lead" data-id="${i.leadId}">Open lead</button></div></div>`)}</div>`.s
    : html`<div class="empty">No reminders due. 🎉</div>`.s;
};
ACT['wa-log'] = el => {
  api('msg.log', { leadId: el.dataset.lead, code: el.dataset.code }, { silent: true }).then(() => {
    el.textContent = 'Opened ✓'; el.classList.add('btn-ghost');
  }).catch(fail);
};

/* ======================= LEAD DETAIL ======================= */
async function openLead(id, keepForm) {
  try {
    const d = await api('lead.get', { leadId: id });
    S.modalLeadId = id;
    S.lead = d;
    renderLead(d);
  } catch (e) { fail(e); }
}
async function refreshLead(msg) {
  const id = S.modalLeadId;
  if (S.view === 'queue') loadQueue(true);
  if (id) await openLead(id);
  if (msg) showMessagePrompt(msg);
}
function showMessagePrompt(m) {
  if (!m) return;
  const box = $('#lead-msg');
  if (!box) return;
  box.innerHTML = m.blocked ? html`<div class="alert warn">${m.code}: ${m.blocked}</div>`.s
    : html`<div class="alert ok row between"><span><b>Notify the patient (${m.code} · ${m.name})</b><br><span class="small">${m.text.slice(0, 160)}${m.text.length > 160 ? '…' : ''}</span></span>
      <a class="btn btn-wa" href="${m.link}" target="_blank" rel="noopener" data-act="wa-log" data-lead="${S.modalLeadId}" data-code="${m.code}">Send on WhatsApp</a></div>`.s;
}

const TRANS_LABEL = {
  'Called by lab': 'Log call: spoke to patient', 'Not reachable': 'Not reachable', 'Test booked': 'Confirm test booked',
  'Lab visit scheduled': 'Schedule lab visit', 'Home sample collection': 'Schedule home collection', 'Sample collected': 'Sample collected',
  'Test done': 'Mark test done', 'Test report generated': 'Mark report generated', 'Not interested': 'Not interested', 'Cancelled': 'Cancel lead',
  'Follow-up: After period': 'Follow-up: after period', 'Follow-up: Will do later': 'Follow-up: will do later', 'Disputed': 'Mark disputed', 'Closed': 'Close lead'
};

function renderLead(d) {
  const L = d.lead, role = S.boot.user.role, admin = role === 'Admin';
  const work = d.lines.filter(l => l.Active && !l.isHeader);
  const head = html`<div class="row" style="gap:8px"><h3>${L.PatientName}</h3><span class="lead-id">${L.LeadID}</span>${statusChip(L.Status)}${slaChip(d.sla)}
    ${L.Urgency === 'Urgent' ? html`<span class="chip bad">Urgent</span>` : ''}${L.OptOut === true ? html`<span class="chip">Opted out</span>` : ''}</div>`;
  const tbtns = d.transitions.filter(t => t.to !== 'Sample collected').map(t => html`<button class="btn btn-sm ${['Cancelled', 'Not interested', 'Disputed'].indexOf(t.to) >= 0 ? 'btn-ghost' : ''}"
      data-act="t-open" data-to="${t.to}" ${t.allowed ? '' : raw('disabled')} title="${t.reason || ''}">${TRANS_LABEL[t.to] || t.to}</button>`);
  const extra = [];
  if (d.canProgress) extra.push(html`<button class="btn btn-sm" data-act="f-open" data-form="progress">Log progress / scans</button>`);
  if (d.canReschedule) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="reschedule">Reschedule</button>`);
  if (d.canUploadReport) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="upload">Upload report PDF</button>`);
  if (d.canUploadPrescription) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="uploadRx">${d.prescription ? 'Replace prescription photo' : 'Upload prescription photo'}</button>`);
  if (d.canRecordPayment) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="payment">${L.PaymentMode ? 'Edit payment' : 'Record payment'}</button>`);
  if (d.canEditTests) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="tests">Edit tests</button>`);
  if (d.canEditLead) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="edit">Edit details</button>`);
  if (d.canFlagDispute) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="dispute">Flag dispute</button>`);
  if (admin && ['Lead generated', 'Called by lab', 'Not reachable', 'Test booked', 'Follow-up: After period', 'Follow-up: Will do later'].indexOf(L.Status) >= 0) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="reroute">Re-route</button>`);
  if (role !== 'Lab User' && ['Test report generated', 'Closed'].indexOf(L.Status) >= 0) extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="rating">Record M9 rating</button>`);
  if (role !== 'Lab User') extra.push(html`<button class="btn btn-sm btn-ghost" data-act="optout">${L.OptOut === true ? 'Remove opt-out' : 'Mark opted out'}</button>`);
  extra.push(html`<button class="btn btn-sm btn-ghost" data-act="f-open" data-form="note">Add note</button>`);

  const alerts = [];
  if (d.pending.length && ['Sample collected', 'Lab visit scheduled', 'Home sample collection'].indexOf(L.Status) >= 0) alerts.push(html`<div class="alert warn">Pending: ${d.pending.join(', ')}</div>`);
  if (L.Status === 'Test done' && d.missingReports.length) alerts.push(html`<div class="alert info">Upload a report PDF for: ${d.missingReports.map(personName).join(' and ')} to mark the report generated.</div>`);
  if (L.Status === 'Test done' && !L.PaymentMode && role !== 'Lab User' && L.PaymentAmount !== undefined) alerts.push(html`<div class="alert warn">Patient payment not recorded yet.</div>`);

  const priced = d.lines.filter(l => l.Active && l.ItemType !== 'PackageComponent');
  const body = html`
    ${alerts}
    <div id="lead-msg"></div>
    <div class="panel"><div class="actions">${tbtns}${extra}</div><div id="lead-form"></div></div>

    <div class="grid g2 section">
      <div><h4>Patient</h4><dl class="kv">
        <dt>Name</dt><dd>${L.PatientName} · ${genderLabel(L.Gender)}, ${L.Age}</dd>
        <dt>Phone</dt><dd>${role === 'Lab User' ? L.Phone : html`<a href="tel:${L.Phone}">${L.Phone}</a>`} · Pincode ${L.Pincode}</dd>
        <dt>Booking</dt><dd>${L.BookingType}${L.BookingType === 'Couple' ? html` · Spouse: ${L.SpouseName} (${genderLabel(L.SpouseGender)}, ${L.SpouseAge})` : ''}</dd>
        <dt>Doctor</dt><dd>${L.ReferringDoctor}</dd>
        <dt>Visit</dt><dd>${L.VisitNumber ? 'V' + L.VisitNumber : '—'}</dd>
        <dt>Clinic</dt><dd>${d.clinic.Name} · ${d.clinic.ClinicPhone || ''}</dd>
        <dt>Partner</dt><dd>${d.partner.name} · ${d.partner.callingNumber}</dd>
        <dt>Preferred mode</dt><dd>${L.PreferredMode || '—'}</dd>
        <dt>Consent</dt><dd>${L.ConsentTicked === true ? '✓ ' : ''}${L.ConsentBy} · ${fdate(L.ConsentAt)}</dd>
        ${L.NotesForLab ? html`<dt>Notes for lab</dt><dd>${L.NotesForLab}</dd>` : ''}
        ${L.LegacyCRMLeadID ? html`<dt>Legacy CRM</dt><dd>${L.LegacyCRMLeadID}</dd>` : ''}
        ${d.prescription ? html`<dt>Prescription</dt><dd><span class="mono">${d.prescription.fileName}</span> · ${fdate(d.prescription.uploadedAt)} <button type="button" class="btn-link small" data-act="rx-view">View</button></dd>` : ''}
      </dl></div>
      <div><h4>Booking</h4><dl class="kv">
        <dt>Created</dt><dd>${fdate(L.CreatedAt)}</dd>
        ${L.FollowUpDate ? html`<dt>Follow-up</dt><dd>${fdate(L.FollowUpDate)} · ${L.FollowUpReason || L.FollowUpCategory}</dd>` : ''}
        ${L.Status === 'Not reachable' ? html`<dt>Retry</dt><dd>${fdate(L.RetryAt)} · ${L.NotReachableReason}</dd>` : ''}
        ${d.lab ? html`<dt>Lab</dt><dd><b>${d.lab.LabName}</b><br><span class="small">${d.lab.Address} · ${d.lab.LabPhone}</span>${d.lab.MapsLink ? html`<br><a class="small" href="${d.lab.MapsLink}" target="_blank" rel="noopener">Google Maps</a>` : ''}</dd>` : ''}
        ${L.ApptDate ? html`<dt>Appointment</dt><dd>${fdate(L.ApptDate)} · ${L.ApptSlot} · ${L.BookingMode}</dd>` : ''}
        ${L.CollectionAddress ? html`<dt>Collection at</dt><dd>${L.CollectionAddress}</dd>` : ''}
        ${L.NextScanDate ? html`<dt>Next scan</dt><dd>${fdate(L.NextScanDate)}</dd>` : ''}
        ${L.SampleCollectedAt ? html`<dt>Sample collected</dt><dd>${fdate(L.SampleCollectedAt)}</dd>` : ''}
        ${L.TestDoneAt ? html`<dt>Test done</dt><dd>${fdate(L.TestDoneAt)}</dd>` : ''}
        ${L.ReportGeneratedAt ? html`<dt>Report</dt><dd>${fdate(L.ReportGeneratedAt)}</dd>` : ''}
        ${L.CancelReason ? html`<dt>Reason</dt><dd>${L.CancelReason}</dd>` : ''}
        ${L.PaymentMode ? html`<dt>Payment</dt><dd>${inr(L.PaymentAmount)} · ${L.PaymentMode} · ${fdate(L.PaymentDate)}${L.PaymentRef ? ' · ' + L.PaymentRef : ''}</dd>` : ''}
      </dl></div>
    </div>

    <div class="section"><h4>Tests</h4><div class="tblwrap" style="max-height:none"><table class="tbl">
      <tr><th>Item</th><th>For</th><th>Progress</th>${role !== 'Lab User' ? html`<th class="num">MRP</th>` : ''}<th class="num">Patient price</th>${admin ? html`<th class="num">Margin</th><th></th>` : ''}</tr>
      ${d.lines.filter(l => l.Active).map(l => html`<tr>
        <td>${l.ItemType === 'PackageComponent' ? html`<span class="muted">↳ </span>${l.ItemName.split(' › ').pop()}` : html`<b>${l.ItemName}</b>`}${l.ItemType === 'Package' ? html` <span class="chip plum">Package</span>` : ''}</td>
        <td>${personName(l.PersonTag)}</td>
        <td>${l.isHeader ? (l.IsDone ? '✓ all components' : '') : l.ScansRequired > 1 ? html`<span class="chip ${l.IsDone ? 'good' : 'info'}">Scan ${l.ScansDone}/${l.ScansRequired}</span>` : l.IsDone ? html`<span class="chip good">Done</span>` : html`<span class="muted small">Pending</span>`}</td>
        ${role !== 'Lab User' ? html`<td class="num">${l.ItemType === 'PackageComponent' ? '' : inr(l.FrozenMRP)}</td>` : ''}
        <td class="num">${l.ItemType === 'PackageComponent' ? '' : inr(l.FrozenPatientPrice)}</td>
        ${admin ? html`<td class="num">${l.ItemType === 'PackageComponent' ? '' : inr(l.FrozenMarginRs)}</td><td>${l.ItemType !== 'PackageComponent' ? html`<button class="btn-link small" data-act="f-open" data-form="override" data-line="${l.LeadTestID}">Override</button>` : ''}</td>` : ''}
      </tr>`)}
      <tr><td colspan="${role === 'Lab User' ? 3 : 4}"><b>Total</b>${L.PatientDiscountRs !== undefined && Number(L.PatientDiscountRs) > 0 ? html` <span class="muted small">(patient saves ${inr(L.PatientDiscountRs)})</span>` : ''}</td>
        <td class="num"><b>${inr(L.ExpectedPatientPrice)}</b></td>${admin ? html`<td class="num"><b>${inr(L.ExpectedMarginRs)}</b></td><td><span class="chip">${L.RevenueState}</span></td>` : ''}</tr>
    </table></div></div>

    <div class="section"><h4>Reports</h4>${d.reports.length ? html`<div class="col">${d.reports.map(r => html`<div class="row" style="${r.Active === true || r.Active === 'TRUE' ? '' : 'opacity:.55'}">
        <span class="chip ${r.Active === true ? 'good' : ''}">${personName(r.PersonTag)}</span><span class="mono">${r.FileName}</span><span class="small muted">${r.FileSizeMB} MB · ${fdate(r.UploadedAt)}${r.ReplacedBy ? ' · replaced by ' + r.ReplacedBy : ''}</span>
        ${r.Active === true || admin ? html`<button class="btn btn-sm btn-ghost" data-act="report-view" data-id="${r.ReportID}">View</button>` : ''}</div>`)}</div>` : html`<p class="muted small">No reports uploaded yet.</p>`}</div>

    ${d.messages.length ? html`<div class="section"><h4>Patient messages (${S.boot.cfg.MSG_MODE === 'MANUAL' ? 'click-to-WhatsApp' : 'API'})</h4><div class="col">${d.messages.map(m => html`<div class="row between panel">
        <span class="grow"><b>${m.code}</b> · ${m.name}${m.lastSent ? html` <span class="chip good">sent ${fdate(m.lastSent)}</span>` : ''}<br><span class="small muted">${m.blocked || m.text}</span></span>
        ${m.blocked ? '' : html`<a class="btn btn-wa btn-sm" href="${m.link}" target="_blank" rel="noopener" data-act="wa-log" data-lead="${L.LeadID}" data-code="${m.code}">Send on WhatsApp</a>`}</div>`)}</div></div>` : ''}

    ${admin && d.duplicates && d.duplicates.length ? html`<div class="section"><h4>Duplicate reviews</h4>${d.duplicates.map(x => html`<div class="small">${x.ReviewID}: ${x.PrimaryLeadID} ⇄ ${x.DuplicateLeadID} · ${x.OverlappingTests} · <b>${x.ResolutionStatus}</b></div>`)}</div>` : ''}
    ${admin && d.statementLines && d.statementLines.length ? html`<div class="section"><h4>Statement lines</h4>${d.statementLines.map(x => html`<div class="small">${x.StatementID} · ${x.LineStatus} · margin ${inr(x.ContractualMarginRs)}${x.FlagNote ? ' · ' + x.FlagNote : ''}</div>`)}</div>` : ''}

    <div class="section"><h4>Activity</h4>${d.activity.length ? html`<div class="timeline">${d.activity.map(a => html`<div class="ev"><div class="small"><b>${a.action.replace(/_/g, ' ').toLowerCase()}</b> ${a.ref && a.action === 'STATUS_CHANGE' ? '· ' + a.ref : ''}</div>
      <div class="small muted">${a.by} (${a.role}) · ${a.at}</div>${a.note ? html`<div class="small">${a.note}</div>` : ''}
      ${admin && (a.before || a.after) ? html`<details class="small"><summary>Before / after</summary><pre class="json">${a.before}\n→ ${a.after}</pre></details>` : ''}</div>`)}</div>` : html`<p class="muted small">No activity yet.</p>`}</div>`;
  openModal('', body, { wide: true, head: head });
  S.modalLeadId = L.LeadID; // openModal() → closeModal() clears it; restore for refreshLead / message prompts
}

/* ---------- action forms ---------- */
function reasonSelect(list, name) { return html`<select name="${name || 'reason'}" required><option value="">Select…</option>${list.map(r => html`<option>${r}</option>`)}</select>`; }
function labSelect(opts, current) {
  return html`<select name="labId" required><option value="">Select fulfilling lab…</option>${opts.map(o => html`<option value="${o.labId}" ${o.ok ? '' : raw('disabled')} ${o.labId === current ? raw('selected') : ''}>
    ${o.ok ? '' : '✕ '}${o.name}${o.area ? ' — ' + o.area : ''} · ${o.pincode}${o.serves ? ' · serves clinic' : ''}${o.ok ? '' : ' (' + o.why + ')'}</option>`)}</select>`;
}
const R = () => S.boot.consts.REASONS;
function transitionFields(d, to) {
  const L = d.lead, role = S.boot.user.role;
  switch (to) {
    case 'Called by lab': return html`<label class="f"><span class="req">Call summary</span><textarea name="note" required placeholder="What did the patient say?"></textarea></label>`;
    case 'Not reachable': return html`<div class="grid g2"><label class="f"><span class="req">Reason</span>${reasonSelect(R().NOT_REACHABLE)}</label>
      <label class="f"><span class="req">Retry at</span><input type="datetime-local" name="retryAt" required value="${addDays(todayStr(), 1)}T11:00"></label></div>`;
    case 'Test booked': return html`<p class="small">Patient confirmed: <b>${d.lines.filter(l => l.Active && l.ItemType !== 'PackageComponent').map(l => l.ItemName).join(', ')}</b> · payable ${inr(L.ExpectedPatientPrice)}. Use "Edit tests" first if the list changed.</p>
      <label class="f"><span>Note (optional)</span><input type="text" name="note"></label>`;
    case 'Lab visit scheduled':
    case 'Home sample collection': {
      const home = to === 'Home sample collection';
      const opts = d.labs ? (home ? d.labs.home : d.labs.visit) : [];
      return html`<label class="f"><span class="req">Fulfilling lab</span>${labSelect(opts, L.AssignedLabID)}</label>
        <p class="small muted">Labs that serve ${d.clinic.Name} and are nearest to pincode ${L.Pincode} are listed first. ✕ = can't perform every test${home ? ' or no home collection here' : ''}.</p>
        <div class="grid g2"><label class="f"><span class="req">Date</span><input type="date" name="apptDate" required min="${todayStr()}" value="${L.ApptDate || addDays(todayStr(), 1)}"></label>
        <label class="f"><span class="req">Time / slot</span><input type="text" name="apptSlot" required placeholder="10:30 or 10:00–11:00" value="${L.ApptSlot || ''}"></label></div>
        ${home ? html`<label class="f"><span class="req">Collection address</span><textarea name="collectionAddress" required>${L.CollectionAddress || ''}</textarea></label>` : ''}`;
    }
    case 'Test done':
      if (L.Status === 'Disputed') return html`<label class="f"><span class="req">Resolution note</span><textarea name="note" required></textarea></label>`;
      return paymentFields(L, role === 'Lab User');
    case 'Test report generated': return html`<p class="small">All persons have an active report PDF. The patient gets M8 and the clinic is emailed.</p>`;
    case 'Not interested':
    case 'Cancelled': return html`<div class="grid g2"><label class="f"><span class="req">Reason</span>${reasonSelect(R().CANCEL)}</label>
      <label class="f"><span>If "Other" — describe</span><input type="text" name="reasonText"></label></div>
      ${role === 'Admin' ? html`<label class="f"><span>If "Duplicate" — primary Lead ID</span><input type="text" name="primaryLeadId" placeholder="GYN-…"></label>` : ''}
      <label class="f"><span>Note</span><input type="text" name="note"></label>`;
    case 'Follow-up: After period':
    case 'Follow-up: Will do later': return html`<div class="grid g2"><label class="f"><span class="req">Follow-up date</span><input type="date" name="followUpDate" required min="${addDays(todayStr(), 1)}"></label>
      <label class="f"><span class="req">Reason</span><select name="reason" required><option value="">Select…</option>${R().FOLLOWUP.map(r => html`<option ${to === 'Follow-up: After period' && r === 'Waiting for next cycle' ? raw('selected') : ''}>${r}</option>`)}</select></label></div>
      <label class="f"><span>If "Other" — describe</span><input type="text" name="reasonText"></label><p class="small muted">The SLA clock pauses until the follow-up date; the lead returns to the top of the queue at 9 AM that day (M7).</p>`;
    case 'Disputed': return html`<label class="f"><span class="req">Dispute note</span><textarea name="note" required></textarea></label><p class="small muted">Revenue is frozen and the lead is held off the payable statement until resolved.</p>`;
    case 'Closed': return html`<p class="small">Report uploaded and commission collected. Closing archives the lead.</p><label class="f"><span>Note</span><input type="text" name="note"></label>`;
  }
  return '';
}
function paymentFields(L, optional) {
  return html`<p class="small">${optional ? 'Payment is entered by the Partner Coordinator — leave blank if you don\'t have it.' : 'Record what the patient paid.'}</p>
    <div class="grid g4"><label class="f"><span class="${optional ? '' : 'req'}">Amount (₹)</span><input type="number" name="paymentAmount" step="0.01" min="0" ${optional ? '' : raw('required')} value="${optional ? '' : (L.PaymentAmount || L.ExpectedPatientPrice || '')}"></label>
    <label class="f"><span class="${optional ? '' : 'req'}">Mode</span><select name="paymentMode" ${optional ? '' : raw('required')}><option value="">Select…</option>${R().PAYMENT_MODES.map(m => html`<option ${L.PaymentMode === m ? raw('selected') : ''}>${m}</option>`)}</select></label>
    <label class="f"><span class="${optional ? '' : 'req'}">Date</span><input type="date" name="paymentDate" max="${todayStr()}" min="${String(L.CreatedAt || '').slice(0, 10)}" value="${L.PaymentDate || (optional ? '' : todayStr())}"></label>
    <label class="f"><span>Reference</span><input type="text" name="paymentRef" value="${L.PaymentRef || ''}"></label></div>`;
}

ACT['t-open'] = el => {
  const to = el.dataset.to, d = S.lead;
  $('#lead-form').innerHTML = html`<form class="col" id="t-form" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
    <h3>${TRANS_LABEL[to] || to}</h3>${transitionFields(d, to)}
    <div class="actions"><button class="btn" type="submit">Save</button><button class="btn btn-ghost" type="button" data-act="f-close">Cancel</button></div></form>`.s;
  $('#t-form').onsubmit = async e => {
    e.preventDefault();
    const p = Object.assign(formData(e.target), { leadId: d.lead.LeadID, to: to, expectedStatus: d.lead.Status });
    if (p.retryAt) p.retryAt = p.retryAt.replace('T', ' ');
    try { const r = await api('lead.transition', p); toast('Updated: ' + r.status, 'ok'); await refreshLead(r.message); } catch (err) { fail(err); }
  };
};
ACT['f-close'] = () => { $('#lead-form').innerHTML = ''; };

ACT['f-open'] = el => {
  const kind = el.dataset.form, d = S.lead, L = d.lead, role = S.boot.user.role;
  let inner = '';
  if (kind === 'progress') {
    const work = d.lines.filter(l => l.Active && !l.isHeader);
    inner = html`<h3>Log progress</h3><p class="small muted">Tick what was done today. Multi-visit scans are logged one at a time (1/3 → 2/3 → 3/3).</p>
      <div class="pick">${work.map(l => html`<label class="opt check">
        ${l.IsDone ? (role !== 'Lab User' ? html`<input type="checkbox" name="undo" data-multi="1" value="${l.LeadTestID}">` : html`<input type="checkbox" disabled checked>`) : html`<input type="checkbox" name="line" data-multi="1" value="${l.LeadTestID}">`}
        <span class="grow">${l.ItemName} <span class="muted small">· ${personName(l.PersonTag)}</span></span>
        <span class="price">${l.IsDone ? html`<span class="chip good">Done${role !== 'Lab User' ? ' — tick to undo' : ''}</span>` : l.ScansRequired > 1 ? html`<span class="chip info">Log scan ${Number(l.ScansDone) + 1} of ${l.ScansRequired}</span>` : html`<span class="small muted">Mark done</span>`}</span></label>`)}</div>
      ${work.some(l => !l.IsDone && l.ScansRequired > 1 && Number(l.ScansDone) + 1 < l.ScansRequired) ? html`<label class="f" style="max-width:260px"><span>Next scan date (for scans not yet complete)</span><input type="date" name="nextScanDate" min="${todayStr()}"></label>` : ''}`;
  } else if (kind === 'reschedule') {
    const opts = d.labs ? (L.Status === 'Home sample collection' ? d.labs.home : d.labs.visit) : [];
    inner = html`<h3>Reschedule</h3><label class="f"><span>Lab</span>${labSelect(opts, L.AssignedLabID)}</label>
      <div class="grid g2"><label class="f"><span class="req">Date</span><input type="date" name="apptDate" required min="${todayStr()}" value="${L.ApptDate}"></label>
      <label class="f"><span class="req">Time / slot</span><input type="text" name="apptSlot" required value="${L.ApptSlot}"></label></div>
      ${L.Status === 'Home sample collection' ? html`<label class="f"><span>Address</span><textarea name="collectionAddress">${L.CollectionAddress}</textarea></label>` : ''}
      <label class="f"><span>Note</span><input type="text" name="note"></label><p class="small muted">The patient will be offered M6 (rescheduled appointment).</p>`;
  } else if (kind === 'upload') {
    const persons = L.BookingType === 'Couple' ? ['P', 'S', 'B'] : ['P'];
    const act = d.reports.filter(r => r.Active === true);
    inner = html`<h3>Upload report PDF</h3><div class="grid g2">
      <label class="f"><span class="req">Report for</span><select name="personTag">${persons.map(p => html`<option value="${p}" ${d.missingReports[0] === p ? raw('selected') : ''}>${personName(p)}${p === 'B' ? ' (combined)' : ''}</option>`)}</select></label>
      <label class="f"><span class="req">PDF file (max ${S.boot.cfg.MAX_REPORT_PDF_MB} MB)</span><input type="file" name="file" accept="application/pdf,.pdf" required></label></div>
      ${act.length ? html`<label class="f"><span>Replaces (for corrected reports)</span><select name="replaceReportId"><option value="">— New report —</option>${act.map(r => html`<option value="${r.ReportID}">${r.FileName} (${personName(r.PersonTag)})</option>`)}</select></label>` : ''}
      <label class="f"><span>Note</span><input type="text" name="note"></label>
      ${L.Status === 'Test done' ? html`<label class="check"><input type="checkbox" name="markGenerated" checked> Mark "Test report generated" once every person has a report</label>` : ''}
      <p class="small muted">File names never contain patient names. Every view of this PDF is logged.</p>`;
  } else if (kind === 'uploadRx') {
    inner = html`<h3>${d.prescription ? 'Replace' : 'Upload'} prescription photo</h3>
      <label class="f"><span class="req">Photo (JPG/PNG, max ${S.boot.cfg.MAX_PRESCRIPTION_MB} MB)</span><input type="file" name="file" accept="image/jpeg,image/png,image/*" capture="environment" required></label>
      ${d.prescription ? html`<p class="small muted">Replaces ${d.prescription.fileName} (uploaded ${fdate(d.prescription.uploadedAt)}). The old photo is removed from Drive.</p>` : ''}`;
  } else if (kind === 'payment') {
    inner = html`<h3>Patient payment</h3>${paymentFields(L, false)}`;
  } else if (kind === 'tests') {
    const couple = L.BookingType === 'Couple';
    const editable = d.lines.filter(l => l.Active && (l.ItemType !== 'PackageComponent' || role === 'Admin'));
    inner = html`<h3>Edit tests</h3><p class="small muted">${role === 'Clinic Manager' ? 'You can edit tests until the partner calls.' : 'Adding or removing tests re-prices the lead from the active rate card and is audit-logged.'}</p>
      <div class="pick">${editable.map(l => html`<div class="opt"><span class="grow">${l.ItemName} <span class="muted small">· ${personName(l.PersonTag)}</span></span>
        <span class="price small">${l.ItemType === 'PackageComponent' ? 'component' : inr(l.FrozenPatientPrice)}</span>
        ${l.IsDone && role !== 'Admin' ? html`<span class="chip good">done</span>` : html`<button type="button" class="btn btn-sm btn-ghost" data-act="rm-line" data-line="${l.LeadTestID}">Remove</button>`}</div>`)}</div>
      <div class="row" style="margin-top:10px"><select name="code" class="grow" style="min-width:220px"><option value="">Add a test or package…</option>${(d.catalogue || []).map(c => html`<option value="${c.code}">${c.name} — ${inr(c.price)}${c.type === 'Package' ? ' (package)' : ''}</option>`)}</select>
      ${couple ? html`<select name="tag" style="width:130px"><option value="P">Patient</option><option value="S">Spouse</option><option value="B">Both</option></select>` : ''}
      <button type="button" class="btn btn-sm" data-act="add-item">Add</button></div>
      <label class="f" style="margin-top:8px"><span>Reason for removal (required for removals after the call)</span><input type="text" name="note"></label>`;
  } else if (kind === 'edit') {
    const admin = role === 'Admin';
    const F = ['PatientName', 'Age', 'Phone', 'Pincode'].concat(L.BookingType === 'Couple' ? ['SpouseName', 'SpouseAge'] : []).concat(['ReferringDoctor', 'Urgency', 'PreferredMode', 'NotesForLab']).concat(admin ? ['CollectionAddress', 'ApptSlot'] : []);
    inner = html`<h3>Edit details</h3><div class="grid g2">${F.map(k => k === 'Urgency' ? html`<label class="f"><span>${k}</span><select name="${k}"><option ${L.Urgency === 'Normal' ? raw('selected') : ''}>Normal</option><option ${L.Urgency === 'Urgent' ? raw('selected') : ''}>Urgent</option></select></label>`
      : k === 'PreferredMode' ? html`<label class="f"><span>${k}</span><select name="${k}"><option value="">—</option><option ${L.PreferredMode === 'Lab visit' ? raw('selected') : ''}>Lab visit</option><option ${L.PreferredMode === 'Home collection' ? raw('selected') : ''}>Home collection</option></select></label>`
      : html`<label class="f"><span>${k}</span><input type="text" name="${k}" value="${L[k] === undefined ? '' : L[k]}"></label>`)}</div>
      ${admin ? html`<label class="f"><span class="req">Audit note</span><input type="text" name="__note" required></label>` : ''}`;
  } else if (kind === 'dispute') {
    inner = html`<h3>Flag a discrepancy</h3><label class="f"><span class="req">What is wrong?</span><textarea name="note" required placeholder="e.g. Patient says the AMH test was not done"></textarea></label><p class="small muted">The DCP Admin reviews flags and decides whether to mark the lead Disputed.</p>`;
  } else if (kind === 'note') {
    inner = html`<h3>Add note</h3><label class="f"><span class="req">Note</span><textarea name="note" required></textarea></label>`;
  } else if (kind === 'reroute') {
    inner = html`<h3>Re-route lead (Admin)</h3><div class="grid g2"><label class="f"><span>Clinic</span><select name="clinicId">${S.boot.clinics.map(c => html`<option value="${c.id}" ${c.id === L.ClinicID ? raw('selected') : ''}>${c.name}</option>`)}</select></label>
      <label class="f"><span>Partner</span><select name="partnerId">${(d.partners || []).map(p => html`<option value="${p.id}" ${p.id === L.PartnerID ? raw('selected') : ''}>${p.name}</option>`)}</select></label></div>
      <label class="f"><span class="req">Note</span><input type="text" name="note" required></label><p class="small muted">Changing partner re-freezes prices from the new partner's active rate card.</p>`;
  } else if (kind === 'rating') {
    inner = html`<h3>Record M9 satisfaction rating</h3><label class="f" style="max-width:220px"><span class="req">Patient's reply</span><select name="rating" required><option value="">Select…</option>${[5, 4, 3, 2, 1].map(n => html`<option>${n}</option>`)}</select></label>`;
  } else if (kind === 'override') {
    const l = d.lines.find(x => x.LeadTestID === el.dataset.line);
    inner = html`<h3>Override price · ${l.ItemName}</h3><input type="hidden" name="leadTestId" value="${l.LeadTestID}"><div class="grid g3">
      <label class="f"><span>MRP</span><input type="number" step="0.01" name="mrp" value="${l.FrozenMRP}"></label>
      <label class="f"><span>Patient price</span><input type="number" step="0.01" name="price" value="${l.FrozenPatientPrice}"></label>
      <label class="f"><span>Gynoveda margin</span><input type="number" step="0.01" name="margin" value="${l.FrozenMarginRs}"></label></div>
      <label class="f"><span class="req">Audit note</span><input type="text" name="note" required></label>`;
  }
  $('#lead-form').innerHTML = html`<form class="col" id="x-form" data-kind="${kind}" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">${inner}
    ${kind === 'tests' ? html`<div class="actions"><button class="btn btn-ghost" type="button" data-act="f-close">Done</button></div>` : html`<div class="actions"><button class="btn" type="submit">Save</button><button class="btn btn-ghost" type="button" data-act="f-close">Cancel</button></div>`}</form>`.s;
  $('#x-form').onsubmit = submitLeadForm;
};

async function submitLeadForm(e) {
  e.preventDefault();
  const form = e.target, kind = form.dataset.kind, f = formData(form), id = S.lead.lead.LeadID;
  try {
    let r = null;
    if (kind === 'progress') {
      const updates = $$('input[name=line]:checked', form).map(c => ({ leadTestId: c.value })).concat($$('input[name=undo]:checked', form).map(c => ({ leadTestId: c.value, undo: true })));
      r = await api('lead.progress', { leadId: id, updates: updates, nextScanDate: f.nextScanDate });
      toast(r.allDone ? 'All tests complete — mark Test done' : 'Progress saved', 'ok');
    } else if (kind === 'reschedule') {
      r = await api('lead.reschedule', Object.assign(f, { leadId: id })); toast('Rescheduled', 'ok');
    } else if (kind === 'upload') {
      const file = $('input[type=file]', form).files[0];
      if (!file) throw new Error('Choose a PDF file.');
      if (file.size > S.boot.cfg.MAX_REPORT_PDF_MB * 1048576) throw new Error('The PDF is larger than ' + S.boot.cfg.MAX_REPORT_PDF_MB + ' MB.');
      const b64 = await readFileB64(file);
      r = await api('report.upload', { leadId: id, personTag: f.personTag, fileName: file.name, b64: b64, replaceReportId: f.replaceReportId || '', note: f.note, markGenerated: !!f.markGenerated });
      toast(r.transitioned ? 'Report uploaded — marked report generated' : 'Report uploaded', 'ok');
      if (r.transitioned) r = r.transitioned;
    } else if (kind === 'uploadRx') {
      const file = $('input[type=file]', form).files[0];
      if (!file) throw new Error('Choose a photo.');
      if (!/^image\/(jpeg|png)$/.test(file.type)) throw new Error('Only JPG or PNG photos can be uploaded.');
      if (file.size > S.boot.cfg.MAX_PRESCRIPTION_MB * 1048576) throw new Error('The photo is larger than ' + S.boot.cfg.MAX_PRESCRIPTION_MB + ' MB.');
      const b64rx = await readFileB64(file);
      r = await api('lead.uploadPrescription', { leadId: id, b64: b64rx, note: f.note });
      toast('Prescription photo saved', 'ok');
    } else if (kind === 'payment') {
      r = await api('lead.payment', Object.assign(f, { leadId: id })); toast('Payment recorded', 'ok');
    } else if (kind === 'edit') {
      const fields = {}; Object.keys(f).forEach(k => { if (k !== '__note' && String(f[k]) !== String(S.lead.lead[k] === undefined ? '' : S.lead.lead[k])) fields[k] = f[k]; });
      r = await api('lead.edit', { leadId: id, fields: fields, note: f.__note }); toast('Saved', 'ok');
    } else if (kind === 'dispute') { r = await api('lead.flagDispute', { leadId: id, note: f.note }); toast('Flag sent to the DCP Admin', 'ok'); }
    else if (kind === 'note') { r = await api('lead.note', { leadId: id, note: f.note }); toast('Note added', 'ok'); }
    else if (kind === 'reroute') { r = await api('lead.reroute', Object.assign(f, { leadId: id })); toast('Re-routed', 'ok'); }
    else if (kind === 'rating') { r = await api('msg.rating', { leadId: id, rating: f.rating }); toast('Rating saved', 'ok'); }
    else if (kind === 'override') { r = await api('lead.overrideLine', Object.assign(f, { leadId: id })); toast('Price overridden', 'ok'); }
    await refreshLead(r && r.message);
  } catch (err) { fail(err); }
}
ACT['add-item'] = async () => {
  const form = $('#x-form'), f = formData(form);
  if (!f.code) { toast('Choose a test or package', 'err'); return; }
  try { const r = await api('lead.addItem', { leadId: S.lead.lead.LeadID, code: f.code, tag: f.tag || 'P' }); (r.warnings || []).forEach(w => toast(w)); toast('Added · new total ' + inr(r.patientPrice), 'ok'); await refreshLead(); ACT['f-open']({ dataset: { form: 'tests' } }); } catch (e) { fail(e); }
};
ACT['rm-line'] = async el => {
  const note = ($('#x-form [name=note]') || {}).value || '';
  try { const r = await api('lead.removeLine', { leadId: S.lead.lead.LeadID, leadTestId: el.dataset.line, note: note }); toast('Removed · new total ' + inr(r.patientPrice), 'ok'); await refreshLead(); ACT['f-open']({ dataset: { form: 'tests' } }); } catch (e) { fail(e); }
};
ACT['optout'] = async () => {
  const L = S.lead.lead;
  try { await api('lead.optout', { leadId: L.LeadID, optOut: L.OptOut !== true }); toast(L.OptOut === true ? 'Opt-out removed' : 'Marked opted out', 'ok'); await refreshLead(); } catch (e) { fail(e); }
};
ACT['report-view'] = async el => {
  const leadId = S.modalLeadId;
  try {
    const r = await api('report.get', { reportId: el.dataset.id });
    const url = URL.createObjectURL(b64ToBlob(r.b64, r.mime));
    const b = openModal(r.fileName, html`<div class="row" style="margin-bottom:10px"><a class="btn btn-sm" href="${url}" download="${r.fileName}">Download</a>
      <a class="btn btn-sm btn-ghost" href="${url}" target="_blank" rel="noopener">Open in new tab</a>${leadId ? html`<button class="btn btn-sm btn-ghost" data-act="back-lead" data-id="${leadId}">← Back to lead</button>` : ''}</div>
      <iframe src="${url}" title="Report" style="width:100%;height:75vh;border:1px solid var(--line);border-radius:8px"></iframe>`, { wide: true });
  } catch (e) { fail(e); }
};
ACT['rx-view'] = async () => {
  const leadId = S.modalLeadId;
  try {
    const r = await api('lead.getPrescription', { leadId: leadId });
    const url = URL.createObjectURL(b64ToBlob(r.b64, r.mime));
    openModal(r.fileName, html`<div class="row" style="margin-bottom:10px"><a class="btn btn-sm" href="${url}" download="${r.fileName}">Download</a>
      <a class="btn btn-sm btn-ghost" href="${url}" target="_blank" rel="noopener">Open in new tab</a>${leadId ? html`<button class="btn btn-sm btn-ghost" data-act="back-lead" data-id="${leadId}">← Back to lead</button>` : ''}</div>
      <img src="${url}" alt="Prescription" style="max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:0 auto">`, { wide: true });
  } catch (e) { fail(e); }
};
ACT['back-lead'] = el => openLead(el.dataset.id);
</script>

<script>
/* ======================= NEW LEAD (BRD §3) ======================= */
const CAP = { sel: {}, dupTimer: null, ack: false };

VIEWS.newlead = main => {
  const clinics = S.boot.clinics.filter(c => c.status !== 'Closed');
  const def = clinics.find(c => c.canCapture) || clinics[0];
  if (!def) { main.innerHTML = html`<div class="card empty">No clinic is assigned to your login. Contact the DCP Admin.</div>`.s; return; }
  CAP.sel = {}; CAP.ack = false;
  main.innerHTML = html`<div style="max-width:820px;margin:0 auto">
    <div class="row between" style="margin-bottom:10px"><h2>New diagnostic lead</h2><span class="muted small">${fdate(todayStr())}</span></div>
    <form id="cap" class="col" autocomplete="off">
      <div class="card col">
        ${clinics.length > 1 ? html`<label class="f"><span class="req">Clinic</span><select name="clinicId" id="cap-clinic">${clinics.map(c => html`<option value="${c.id}" ${c.id === def.id ? raw('selected') : ''}>${c.name}${c.canCapture ? '' : ' (not accepting leads)'}</option>`)}</select></label>`
          : html`<input type="hidden" name="clinicId" id="cap-clinic" value="${def.id}"><div class="row"><b>${def.name}</b><span class="muted small">· routed to ${def.partner}</span></div>`}
        <div id="cap-block"></div>
        <div class="grid g2">
          <label class="f"><span class="req">Patient name</span><input type="text" name="patientName" required maxlength="80"></label>
          <div class="grid g2"><label class="f"><span class="req">Gender</span><select name="gender" id="cap-gender"><option value="F">Female</option><option value="M">Male</option></select></label>
            <label class="f"><span class="req">Age</span><input type="number" name="age" required min="18" max="65" inputmode="numeric"></label></div>
          <label class="f"><span class="req">Mobile</span><input type="tel" name="phone" id="cap-phone" required inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile"></label>
          <label class="f"><span class="req">Pincode</span><input type="text" name="pincode" required inputmode="numeric" maxlength="6" pattern="[1-9][0-9]{5}"></label>
        </div>
        <div class="row"><span class="small muted" style="min-width:90px">Booking</span>
          <div class="seg"><label><input type="radio" name="bookingType" value="Individual" checked><span>Individual</span></label><label><input type="radio" name="bookingType" value="Couple"><span>Couple</span></label></div></div>
        <div id="cap-spouse" class="grid g3 hide">
          <label class="f"><span class="req">Spouse name</span><input type="text" name="spouseName" maxlength="80"></label>
          <label class="f"><span class="req">Spouse age</span><input type="number" name="spouseAge" min="${S.boot.cfg.SPOUSE_AGE_MIN}" max="${S.boot.cfg.SPOUSE_AGE_MAX}" inputmode="numeric"></label>
          <label class="f"><span class="req">Spouse gender</span><select name="spouseGender"><option value="M">Male</option><option value="F">Female</option></select></label>
        </div>
        <div class="grid g2">
          <label class="f"><span class="req">Referring doctor</span><select name="referringDoctor" id="cap-doc" required></select></label>
          <label class="f hide" id="cap-doc-other"><span class="req">Doctor's name</span><input type="text" name="referringDoctorOther" maxlength="80"></label>
        </div>
        <label class="f"><span class="req">Patient's visit to this clinic</span><select name="visitNumber" required>
          ${Array.from({length: 10}, (_, i) => i + 1).map(n => html`<option value="${n}">V${n}${n === 1 ? ' — first visit' : ''}</option>`)}
          <option value="11">V11+</option>
        </select>
        <span class="small muted">Which visit is this — has the patient been here before and not taken the test, or is this their first time?</span></label>
      </div>

      ${S.boot.cfg.RX_ENABLED ? html`<div class="card col">
        <h3>Prescription pad photo <span class="small muted">(optional)</span></h3>
        <label class="f"><span>Photo (JPG/PNG, max ${S.boot.cfg.MAX_PRESCRIPTION_MB} MB)</span><input type="file" name="rxFile" id="cap-rx" accept="image/jpeg,image/png,image/*" capture="environment"></label>
        <div id="cap-rx-preview"></div>
        <p class="small muted">Photograph the doctor's prescription pad clearly. It's attached to this lead for the lab/partner to see — the lead still submits fine if you skip this.</p>
      </div>` : ''}

      <div class="card col">
        <div class="row between"><h3>Recommended tests</h3><input type="search" id="cap-find" placeholder="Find a test…" style="max-width:240px"></div>
        <div id="cap-hint" class="small muted">Only items on ${def.partner}'s active rate card are listed, with the special Gynoveda price.</div>
        <div class="pick" id="cap-items"></div>
        <div class="row between" id="cap-total" style="padding-top:4px"></div>
      </div>

      <div class="card col">
        <div class="grid g3">
          <label class="f"><span>Urgency</span><select name="urgency"><option>Normal</option><option>Urgent</option></select></label>
          <label class="f"><span>Preferred mode</span><select name="preferredMode" id="cap-mode"><option value="">No preference</option><option>Lab visit</option><option>Home collection</option></select></label>
        </div>
        <div id="cap-mode-note"></div>
        <label class="f"><span>Notes for the lab</span><textarea name="notesForLab" maxlength="500" placeholder="Clinical context, cycle-day timing…"></textarea></label>
        <label class="check panel"><input type="checkbox" name="consent" required>
          <span><b>Patient consent (DPDP Act, 2023)</b><br><span class="small">I have obtained verbal consent from the patient<span id="cap-consent-sp" class="hide"> and spouse</span> to share their name, mobile number, pincode and recommended tests with the assigned diagnostic partner and lab, only for scheduling, sample collection, testing, report delivery and service updates by phone, WhatsApp or SMS.</span></span></label>
        <div id="cap-dup"></div>
        <div class="actions"><button class="btn" type="submit" id="cap-submit">Submit lead</button><button class="btn btn-ghost" type="reset" data-act="cap-reset">Clear</button></div>
      </div>
    </form></div>`.s;
  const form = $('#cap');
  const refresh = () => capRefresh(form);
  form.addEventListener('change', e => { if (e.target.name !== 'referringDoctorOther') refresh(); if (e.target.name === 'phone') capDupCheck(form); });
  $('#cap-phone').addEventListener('blur', () => capDupCheck(form));
  $('#cap-find').addEventListener('input', () => capRenderItems(form));
  if ($('#cap-rx')) $('#cap-rx').addEventListener('change', () => capRxPreview(form));
  form.onsubmit = e => { e.preventDefault(); capSubmit(form); };
  refresh();
};
ACT['cap-reset'] = () => setTimeout(() => go('newlead'), 0);

function capRxPreview(form) {
  const input = $('#cap-rx', form), box = $('#cap-rx-preview'), file = input.files[0];
  if (!file) { box.innerHTML = ''; return; }
  const maxMB = S.boot.cfg.MAX_PRESCRIPTION_MB;
  if (!/^image\/(jpeg|png)$/.test(file.type)) { box.innerHTML = html`<div class="alert err">Only JPG or PNG photos are allowed.</div>`.s; input.value = ''; return; }
  if (file.size > maxMB * 1048576) { box.innerHTML = html`<div class="alert err">That photo is larger than ${maxMB} MB — retake it at a lower resolution or crop it.</div>`.s; input.value = ''; return; }
  const url = URL.createObjectURL(file);
  box.innerHTML = html`<div class="row" style="align-items:flex-start;gap:10px"><img src="${url}" style="max-width:160px;max-height:160px;border:1px solid var(--line);border-radius:8px;object-fit:cover">
    <div class="small muted">${file.name} · ${(file.size / 1048576).toFixed(1)} MB<br><button type="button" class="btn-link small" data-act="cap-rx-clear">Remove</button></div></div>`.s;
}
ACT['cap-rx-clear'] = () => { const input = $('#cap-rx'); if (input) input.value = ''; $('#cap-rx-preview').innerHTML = ''; };

function capClinic(form) { const id = $('#cap-clinic', form).value; return S.boot.clinics.find(c => c.id === id); }
function capItems(form) { const c = capClinic(form); return (S.boot.catalogues[c.partnerId] || []); }
function capRefresh(form) {
  const c = capClinic(form), f = formData(form);
  $('#cap-block').innerHTML = c.canCapture ? '' : html`<div class="alert err">${c.captureBlock}</div>`.s;
  $('#cap-submit').disabled = !c.canCapture;
  const couple = f.bookingType === 'Couple';
  $('#cap-spouse').classList.toggle('hide', !couple);
  $$('#cap-spouse input, #cap-spouse select').forEach(i => { i.required = couple; });
  $('#cap-consent-sp').classList.toggle('hide', !couple);
  const doc = $('#cap-doc');
  if (doc.dataset.clinic !== c.id) {
    doc.dataset.clinic = c.id;
    const docs = c.doctors.filter(d => !/^Other/i.test(d));
    doc.innerHTML = html`${docs.length !== 1 ? html`<option value="">Select…</option>` : ''}${docs.map(d => html`<option>${d}</option>`)}<option value="Other — type name">Other — type name</option>`.s;
  }
  const other = /^Other/.test(doc.value);
  $('#cap-doc-other').classList.toggle('hide', !other);
  $('#cap-doc-other input').required = other;
  capRenderItems(form);
}
function capPersonGenders(f) { return { P: f.gender, S: f.bookingType === 'Couple' ? f.spouseGender : '' }; }
function capItemHint(item, f) {
  const g = capPersonGenders(f), couple = f.bookingType === 'Couple';
  if (item.type === 'Package') {
    const needM = item.maleCodes.length > 0, needF = item.femaleCodes.length > 0;
    const hasM = g.P === 'M' || g.S === 'M', hasF = g.P === 'F' || g.S === 'F';
    if ((needM && !hasM) || (needF && !hasF)) {
      const side = needM && !hasM ? 'male' : 'female';
      return S.boot.cfg.PACKAGE_INDIVIDUAL_RULE === 'REQUIRE_COUPLE' ? { block: 'Includes ' + side + ' tests — switch to Couple' } : { warn: side + ' components will be skipped' };
    }
    return {};
  }
  if (!couple) {
    if (item.gender === 'M' && g.P === 'F') return { block: 'Male-only — use Couple' };
    if (item.gender === 'F' && g.P === 'M') return { block: 'Female patients only' };
  }
  return {};
}
function capRenderItems(form) {
  const f = formData(form), items = capItems(form), q = ($('#cap-find').value || '').toLowerCase();
  const couple = f.bookingType === 'Couple';
  Object.keys(CAP.sel).forEach(code => { if (!items.some(i => i.code === code)) delete CAP.sel[code]; });
  $('#cap-items').innerHTML = items.filter(i => !q || i.name.toLowerCase().indexOf(q) >= 0 || CAP.sel[i.code]).map(i => {
    const hint = capItemHint(i, f), on = !!CAP.sel[i.code];
    const comps = i.type === 'Package' ? 'Includes: ' + i.components.F.map(c => c.name).join(', ') + (i.components.M.length ? ' · Male: ' + i.components.M.map(c => c.name).join(', ') : '') : '';
    return html`<div class="opt ${on ? 'sel' : ''}">
      <input type="checkbox" data-code="${i.code}" class="cap-pick" ${on ? raw('checked') : ''} ${hint.block && !on ? raw('disabled') : ''}>
      <span class="grow"><b>${i.name}</b>${i.type === 'Package' ? html` <span class="chip plum">Package</span>` : ''}${i.scans > 1 ? html` <span class="chip info">${i.scans} scans</span>` : ''}${!i.home ? html` <span class="chip" title="Lab visit only">Lab visit</span>` : ''}
        ${hint.block ? html` <span class="chip bad">${hint.block}</span>` : hint.warn ? html` <span class="chip warn">${hint.warn}</span>` : ''}
        ${comps ? html`<br><span class="small muted">${comps}</span>` : ''}</span>
      ${couple && i.type === 'SingleTest' && on ? html`<select class="cap-tag" data-code="${i.code}" style="width:110px;min-height:30px;padding:3px 6px">
        ${['P', 'S', 'B'].map(t => html`<option value="${t}" ${CAP.sel[i.code] === t ? raw('selected') : ''}>${personName(t)}</option>`)}</select>` : ''}
      <span class="price"><b>${inr(i.price)}</b>${i.mrp > i.price ? html`<br><s class="small muted">${inr(i.mrp)}</s>` : ''}</span></div>`.s;
  }).join('') || html`<div class="empty">No matching tests.</div>`.s;
  $$('.cap-pick', form).forEach(cb => cb.onchange = () => {
    if (cb.checked) CAP.sel[cb.dataset.code] = defaultTag(items.find(i => i.code === cb.dataset.code), f); else delete CAP.sel[cb.dataset.code];
    capRenderItems(form); capDupCheck(form);
  });
  $$('.cap-tag', form).forEach(s => s.onchange = () => { CAP.sel[s.dataset.code] = s.value; capRenderItems(form); });
  // totals (B-tagged single tests are priced for both persons)
  let mrp = 0, price = 0, n = 0, labOnly = false;
  Object.keys(CAP.sel).forEach(code => {
    const i = items.find(x => x.code === code); if (!i) return;
    const mult = i.type === 'SingleTest' && couple && CAP.sel[code] === 'B' ? 2 : 1;
    mrp += i.mrp * mult; price += i.price * mult; n += mult; if (!i.home) labOnly = true;
  });
  $('#cap-total').innerHTML = html`<span class="small muted">${n} item(s) selected</span><span>${mrp > price ? html`<s class="muted small">${inr(mrp)}</s> ` : ''}<b style="font-size:16px">${inr(price)}</b>${mrp > price ? html` <span class="chip good">Patient saves ${inr(mrp - price)}</span>` : ''}</span>`.s;
  $('#cap-mode-note').innerHTML = labOnly && f.preferredMode === 'Home collection' ? html`<div class="alert warn">A selected scan/imaging test needs a lab visit — the mode will be set to Lab visit.</div>`.s : '';
}
function defaultTag(i, f) {
  if (f.bookingType !== 'Couple' || !i) return 'P';
  const g = capPersonGenders(f);
  if (i.gender === 'M') return g.P === 'M' ? 'P' : 'S';
  if (i.gender === 'F') return g.P === 'F' ? 'P' : 'S';
  return 'P';
}
function capDupCheck(form) {
  clearTimeout(CAP.dupTimer);
  CAP.dupTimer = setTimeout(async () => {
    const f = formData(form);
    if (!/^[6-9]\d{9}$/.test(f.phone || '') || !Object.keys(CAP.sel).length) { $('#cap-dup').innerHTML = ''; return; }
    try {
      const r = await api('lead.dupcheck', { clinicId: f.clinicId, phone: f.phone, codes: Object.keys(CAP.sel) }, { silent: true });
      $('#cap-dup').innerHTML = r.matches.length ? html`<div class="alert warn"><b>Possible duplicate.</b> This mobile already has a lead with an overlapping test in the last ${r.windowDays} days:
        ${r.matches.map(m => html`<br>· ${m.leadId} at ${m.clinic} on ${fdate(m.created)} (${m.status}) — ${m.overlapping}`)}
        <br><span class="small">You can still submit; the pair goes to the Admin's duplicate review. The first clinic to capture keeps the credit.</span></div>`.s : '';
    } catch (e) { /* non-blocking */ }
  }, 400);
}
async function capSubmit(form, acknowledge) {
  const f = formData(form);
  const items = Object.keys(CAP.sel).map(code => ({ code: code, tag: CAP.sel[code] }));
  if (!items.length) { toast('Select at least one test or package', 'err'); return; }
  if (!f.consent) { toast('Patient consent is required', 'err'); return; }
  const payload = Object.assign({}, f, { items: items, consent: true, acknowledgeDuplicate: !!acknowledge, age: Number(f.age), spouseAge: f.spouseAge ? Number(f.spouseAge) : '' });
  delete payload.rxFile;
  $('#cap-submit').disabled = true;
  try {
    const rxInput = $('#cap-rx', form), rxFile = rxInput && rxInput.files[0];
    if (rxFile) payload.rxB64 = await readFileB64(rxFile);
    const r = await api('lead.create', payload);
    capSuccess(r, f);
  } catch (e) {
    $('#cap-submit').disabled = false;
    if (e.code === 'DUPLICATE_WARNING') {
      if (await confirmBox(e.message + ' Submit anyway?', 'Submit anyway')) capSubmit(form, true);
      return;
    }
    fail(e);
  }
}
function capSuccess(r, f) {
  // Free lab-side alert: the lab was already emailed server-side; best-effort auto-open a
  // click-to-WhatsApp tab per distinct lab manager too. Most browsers only allow this right after
  // a user gesture, so it can be silently blocked — the buttons below are the reliable fallback.
  (r.labAlerts || []).forEach(a => { try { window.open(a.link, '_blank', 'noopener'); } catch (e) { /* popup blocked */ } });
  $('#main').innerHTML = html`<div style="max-width:620px;margin:0 auto"><div class="card col">
    <div class="alert ok"><b>Lead submitted.</b> Routed to ${r.partner}, who will call within 24 hours.</div>
    <dl class="kv"><dt>Lead ID</dt><dd class="mono"><b>${r.leadId}</b></dd><dt>Patient</dt><dd>${f.patientName}</dd>
      <dt>Payable at lab</dt><dd><b>${inr(r.patientPrice)}</b>${r.mrp > r.patientPrice ? html` <span class="muted small">(MRP ${inr(r.mrp)})</span>` : ''}</dd></dl>
    ${(r.warnings || []).map(w => html`<div class="alert warn">${w}</div>`)}
    ${r.duplicates && r.duplicates.length ? html`<div class="alert info">Logged for duplicate review with ${r.duplicates.join(', ')}.</div>` : ''}
    ${r.m1 ? html`<div class="panel"><b>Send the welcome message (M1) to the patient</b><p class="small">${r.m1.text}</p>
      <a class="btn btn-wa" href="${r.m1.link}" target="_blank" rel="noopener" data-act="wa-log" data-lead="${r.leadId}" data-code="M1">Send on WhatsApp</a></div>` : ''}
    ${(r.labAlerts || []).length ? html`<div class="panel"><b>Lab alert</b><p class="small">${r.labAlerts.length === 1 ? 'The lab manager has' : 'All ' + r.labAlerts.length + ' lab managers have'} been emailed. A WhatsApp tab may have opened automatically — if your browser blocked it, tap below to send it yourself:</p>
      <div class="row" style="flex-wrap:wrap;gap:8px">${r.labAlerts.map(a => html`<a class="btn btn-wa btn-sm" href="${a.link}" target="_blank" rel="noopener">WhatsApp ${a.name || a.labName || 'lab manager'}</a>`)}</div></div>` : ''}
    <div class="actions"><button class="btn" data-act="nav" data-view="newlead">Capture another lead</button><button class="btn btn-ghost" data-act="open-lead" data-id="${r.leadId}">Open this lead</button></div>
  </div></div>`.s;
}
</script>

<script>
/* ======================= DASHBOARD (BRD §9.1) ======================= */
const DASH = { data: null, monthly: null, expS: new Set(), expC: new Set() };
VIEWS.dashboard = async main => {
  const b = S.boot;
  const to = todayStr(), from = addDays(to, -29);
  main.innerHTML = html`<div class="row between" style="margin-bottom:10px"><h2>Pilot dashboard</h2></div>
    <div id="pulse-body"><div class="card empty">Loading…</div></div>
    <!-- MoM comparison filters -->
    <form class="card grid g4" id="dm-form" style="margin-top:12px;margin-bottom:0">
      <label class="f"><span>Partner</span><select name="partnerId"><option value="">All partners</option>${(b.partners || []).map(p => html`<option value="${p.id}">${p.name}</option>`)}</select></label>
      <label class="f"><span>Clinic</span><select name="clinicId"><option value="">All clinics</option>${b.clinics.map(c => html`<option value="${c.id}">${c.name}</option>`)}</select></label>
      <label class="f"><span>Months to compare</span><select name="months"><option value="2">2 months</option><option value="3">3 months</option><option value="4">4 months</option><option value="6">6 months</option></select></label>
    </form>
    <div id="dm-body" class="section" style="margin-top:8px"><div class="card empty">Loading…</div></div>
    <!-- Detailed KPI filters -->
    <form class="card grid g5" id="d-form" style="margin-top:12px">
      <label class="f"><span>From</span><input type="date" name="from" value="${from}"></label>
      <label class="f"><span>To</span><input type="date" name="to" value="${to}"></label>
      <label class="f"><span>Adoption month</span><input type="month" name="month" value="${to.slice(0, 7)}"></label>
      <label class="f"><span>Partner</span><select name="partnerId"><option value="">All</option>${(b.partners || []).map(p => html`<option value="${p.id}">${p.name}</option>`)}</select></label>
      <label class="f"><span>Clinic</span><select name="clinicId"><option value="">All</option>${b.clinics.map(c => html`<option value="${c.id}">${c.name}</option>`)}</select></label>
    </form><div id="d-body" class="section"><div class="card empty">Loading…</div></div>`.s;

  // Load MoM comparison table
  const loadMonthly = async () => {
    const f = formData($('#dm-form'));
    try {
      DASH.monthly = await api('dash.monthly', f);
      renderMonthlyTable(DASH.monthly);
      renderPulse();
    } catch (e) { $('#dm-body').innerHTML = html`<div class="card empty">Could not load comparison: ${e.message}</div>`.s; }
  };
  $('#dm-form').onchange = loadMonthly;

  // Load detailed KPI dashboard
  const loadD = async () => {
    const f = formData($('#d-form'));
    try { renderDash(await api('dash.summary', f)); renderPulse(); } catch (e) { fail(e); }
  };
  $('#d-form').onchange = loadD;
  await Promise.all([loadMonthly(), loadD()]);
};

/* NB: pass arrays of html`` results straight into the next html`` — never .join('') them first. Joining turns the Raw
 * objects into plain strings, which the tag then escapes, and the table shows up as literal markup. */
function renderMonthlyTable(d) {
  if (!d || !d.months || !d.months.length) {
    $('#dm-body').innerHTML = html`<div class="card empty">No data.</div>`.s;
    return;
  }
  const months = d.months; // oldest → newest
  // Build header: row label | Month1 MTD | Month2 MTD | …
  const metrics = [
    { key: 'liveClinics',   label: 'Live clinic',       unit: 'MTD', fmt: v => v === null ? '—' : v },
    { key: 'leads',         label: 'leads',             unit: 'MTD', fmt: v => v === null ? '—' : v },
    { key: 'adoption',      label: 'Adoption',          unit: '%',   fmt: v => v === null ? '—' : v + '%', highlight: true },
    { key: 'noOfTests',     label: 'No. of tests',      unit: 'MTD', fmt: v => v === null ? '—' : v },
    { key: 'testPerPatient',label: 'Test per patient',  unit: 'MTD', fmt: v => v === null ? '—' : v },
    { key: 'maleTest',      label: 'Male test',         unit: 'MTD', fmt: v => v === null ? '—' : v },
    { key: 'femaleTest',    label: 'Female test',       unit: 'MTD', fmt: v => v === null ? '—' : v },
    { key: 'gynoMarginPct', label: 'Gyno Margin',       unit: '%',   fmt: v => v === null ? '—' : v + '%', highlight: false },
    { key: 'gynoRevLakhs',  label: 'Gyno Rev.',         unit: 'INR', fmt: v => v === null ? '—' : v.toFixed(2) + ' L' }
  ];
  const hdr = html`<tr><th style="min-width:140px">GynoDcp${months.length > 1 ? months.length : ''}</th>${months.map(m => html`<th class="num" colspan="1">${m.label} <span class="small muted" style="font-weight:normal">▼</span></th>`)}</tr>`;
  // Sub-header row for MTD/%/INR labels
  const subHdr = html`<tr class="muted small"><td></td>${months.map(() => html`<td class="num"></td>`)}</tr>`;
  const rows = metrics.map(mt => {
    const cells = months.map((m, i) => {
      const val = mt.fmt(m[mt.key]);
      const prev = i > 0 ? m[mt.key] : null;
      const prevVal = i > 0 ? months[i - 1][mt.key] : null;
      // highlight adoption row red (below target) or color change
      // Threshold raised from 10% to 50%: Adoption is now booked÷leads (expected to run much
      // higher than the old footfall-based ratio), so 10% was never going to flag anything real.
      const isAdoption = mt.highlight && m[mt.key] !== null && m[mt.key] < 50;
      const style = isAdoption ? 'background:var(--bad-bg,#fff0f0);color:var(--bad)' : '';
      return html`<td class="num" style="${style}">${val}</td>`;
    });
    return html`<tr><td>${mt.label} <span class="small muted">${mt.unit}</span></td>${cells}</tr>`;
  });
  $('#dm-body').innerHTML = html`<div class="card" style="padding:0"><div class="tblwrap"><table class="tbl" style="font-size:13px">
    ${hdr}${rows}
  </table></div></div>`.s;
}

/* ---------- Pulse: a "few seconds" read of the whole business ----------
 * Built entirely from data already fetched for the MoM table (DASH.monthly) and the
 * detailed KPI dashboard (DASH.data) — no extra API call. Renders once both are in,
 * and re-renders whenever either source refreshes (its own filters changed).
 */
function pulseTrendPct(cur, prev) {
  if (prev === null || prev === undefined || !isFinite(prev) || prev === 0) return null;
  return Math.round((cur - prev) / prev * 1000) / 10;
}
function pulseTrend(cur, prev) {
  const t = pulseTrendPct(cur, prev);
  if (t === null) return { html: html`<span class="trend flat small">— vs last month</span>`, dir: 0 };
  const dir = t > 0 ? 1 : t < 0 ? -1 : 0;
  const cls = dir > 0 ? 'up' : dir < 0 ? 'down' : 'flat';
  const arrow = dir > 0 ? '▲' : dir < 0 ? '▼' : '—';
  return { html: html`<span class="trend ${cls} small">${arrow} ${Math.abs(t)}% vs last month</span>`, dir: dir };
}
function pulseKpi(kpis, key) { return (kpis || []).find(k => k.key === key) || { value: null, target: 0, status: '' }; }
function renderPulse() {
  const box = $('#pulse-body');
  if (!box) return;
  if (!DASH.monthly || !DASH.monthly.months || !DASH.monthly.months.length || !DASH.data) return;
  const months = DASH.monthly.months, cur = months[months.length - 1], prev = months.length > 1 ? months[months.length - 2] : null;
  const kConv = pulseKpi(DASH.data.kpis, 'conversion'), kAdopt = pulseKpi(DASH.data.kpis, 'adoption');
  const breaches = DASH.data.breachCount || 0, disputed = DASH.data.disputed || 0, dupes = DASH.data.pendingDuplicates || 0;

  const badSignals = (kConv.status === 'bad' ? 1 : 0) + (kAdopt.status === 'bad' ? 1 : 0) + (breaches > 0 ? 1 : 0) + (disputed > 0 ? 1 : 0);
  const warnSignals = (kConv.status === 'warn' ? 1 : 0) + (kAdopt.status === 'warn' ? 1 : 0) + (dupes > 0 ? 1 : 0);
  const level = badSignals >= 2 ? 'err' : (badSignals >= 1 || warnSignals >= 1) ? 'warn' : 'ok';
  const verdict = level === 'err' ? 'Needs immediate attention' : level === 'warn' ? 'Needs attention' : 'On track';

  const leadsTrend = pulseTrend(cur.leads, prev && prev.leads);
  const revTrend = pulseTrend(cur.gynoRevLakhs, prev && prev.gynoRevLakhs);
  const fmtPct = v => (v === null || v === undefined ? '—' : v + '%');

  const banner = html`<div class="alert ${level} pulse-banner"><b>${cur.label}:</b> ${cur.leads} leads (${leadsTrend.html})
    · Adoption <b>${fmtPct(kAdopt.value)}</b> (target ${kAdopt.target}%) · Conversion <b>${fmtPct(kConv.value)}</b> (target ${kConv.target}%)
    · ${breaches} SLA breach${breaches === 1 ? '' : 'es'} · ${disputed} disputed${dupes ? ' · ' + dupes + ' duplicate review' + (dupes === 1 ? '' : 's') + ' pending' : ''}
    — <b>${verdict}</b></div>`;

  // These two are the ones people mix up — spelled out once, plainly, so the same
  // explanation doesn't need repeating every time someone asks "why are these different?".
  // Both now share the same lead population and the same rolling 30-day window — the only
  // difference is how far down the funnel a lead has to get to count.
  const explainer = html`<div class="card" style="margin-top:10px;background:var(--plum-50);border-color:var(--plum-100)">
    <div class="row" style="gap:18px;align-items:flex-start">
      <div class="grow"><b>Adoption</b> <span class="small muted">— of leads referred by the clinic, what share got the test BOOKED (early funnel checkpoint)</span>
        ${kAdopt.detail ? html`<div class="small muted" style="margin-top:2px">${kAdopt.detail}</div>` : ''}</div>
      <div class="grow"><b>Conversion</b> <span class="small muted">— of leads referred by the clinic, what share actually completed the test (late funnel checkpoint)</span>
        ${kConv.detail ? html`<div class="small muted" style="margin-top:2px">${kConv.detail}</div>` : ''}</div>
    </div>
    <div class="small muted" style="margin-top:8px">Same leads, same rolling 30-day window — Adoption counts them the moment they book, Conversion only once the test is actually done. The gap between the two is where follow-through breaks down after booking, not a referral problem.</div>
  </div>`;

  const tile = (label, value, statusClass, sub) => html`<div class="card kpi lg ${statusClass}"><div class="small muted">${label}</div><div class="v">${value}</div><div>${sub}</div></div>`;
  const trendClass = d => d.dir > 0 ? 'good' : d.dir < 0 ? 'bad' : '';
  const tiles = html`<div class="grid g3" style="margin-top:10px">
    ${tile('Leads this month', cur.leads, trendClass(leadsTrend), leadsTrend.html)}
    ${tile('Adoption · booked', fmtPct(kAdopt.value), kAdopt.status, html`<span class="small muted">Target ${kAdopt.target}% · ${kAdopt.detail || ''}</span>`)}
    ${tile('Conversion · test done', fmtPct(kConv.value), kConv.status, html`<span class="small muted">Target ${kConv.target}% · ${kConv.detail || ''}</span>`)}
    ${tile('Gyno revenue', cur.gynoRevLakhs.toFixed(2) + ' L', trendClass(revTrend), revTrend.html)}
    ${tile('SLA breaches', breaches, breaches > 0 ? 'bad' : 'good', html`<span class="small muted">${breaches > 0 ? 'Open now — see below' : 'All clear'}</span>`)}
    ${tile('Disputes + dupes', disputed + dupes, (disputed + dupes) > 0 ? 'warn' : 'good', html`<span class="small muted">${disputed} disputed · ${dupes} duplicate review${dupes === 1 ? '' : 's'}</span>`)}
  </div>`;

  box.innerHTML = html`${banner}${explainer}${tiles}`.s;
}

function renderDash(d) {
  DASH.data = d;
  const maxW = Math.max(1, ...d.weeks.map(w => w.leads));
  const maxM = Math.max(1, ...d.revenue.months.map(m => Math.max(m.earned, m.collected)));
  $('#d-body').innerHTML = html`
    <div class="grid g5">${d.kpis.map(k => html`<div class="card kpi ${k.status}"><div class="small muted">${k.label}</div>
      <div class="v">${k.value === null ? '—' : k.value + '%'}</div><div class="small">Target ${k.target}%</div>${k.what ? html`<div class="small" style="font-style:italic">${k.what}</div>` : ''}<div class="small muted">${k.detail}</div></div>`)}</div>
    <div class="grid g2 section">
      <div class="card"><h3>Funnel · ${d.totals.leads} leads (${fdate(d.range.from)} – ${fdate(d.range.to)})</h3><div class="col" style="margin-top:10px">
        ${d.funnel.map(f => html`<div class="row"><span style="width:170px" class="small">${f.stage}</span><div class="bar grow"><i style="width:${d.totals.leads ? Math.max(2, f.count / d.totals.leads * 100) : 0}%"></i><b>${f.count}</b></div>
          <span class="small muted" style="width:90px;text-align:right">${f.pctOfLeads === null ? '' : f.pctOfLeads + '%'}${f.stepPct !== null && f.stepPct !== 100 ? ' · step ' + f.stepPct + '%' : ''}</span></div>`)}</div></div>
      <div class="card"><h3>Commission</h3><dl class="kv" style="margin-top:10px">
        <dt>Earned (period)</dt><dd><b>${inr(d.revenue.earnedInRange)}</b></dd><dt>Collected (period)</dt><dd><b>${inr(d.revenue.collectedInRange)}</b></dd>
        <dt>On statements</dt><dd>${inr(d.revenue.statementEarned)} earned · ${inr(d.revenue.statementCollected)} collected</dd>
        <dt>Outstanding</dt><dd><b style="color:var(--bad)">${inr(d.revenue.outstanding)}</b></dd>
        ${Object.keys(d.revenue.byState).map(k => html`<dt>${k}</dt><dd>${inr(d.revenue.byState[k])}</dd>`)}</dl>

      <div id="dash-clinics">${clinicsTree(d)}</div></div>
    <div class="card section"><h3>Labs</h3>${scoreTable(d.labs, false)}</div>`.s;

function clinicsTree(d) {
  const states = d.byState || [], cities = d.byCity || [], clinics = d.clinics || [];
  if (!states.length) return html`<div class="empty">No clinic activity in this range.</div>`;
  const rows = [];
  states.forEach(s => {
    const open = DASH.expS.has(s.state);
    rows.push(html`<tr class="click geo-row" data-act="dash-toggle-state" data-k="${s.state}">
      <td><span class="chev">${open ? '▾' : '▸'}</span> <b>${s.state}</b> <span class="small muted">· ${s.clinicCount} clinic${s.clinicCount === 1 ? '' : 's'}</span></td>
      <td class="num">${s.leads}</td><td class="num">${s.testDone}</td><td class="num">${s.conversion === null ? '—' : s.conversion + '%'}</td><td class="num">—</td><td class="num">—</td><td class="num">${inr(s.margin)}</td></tr>`);
    if (!open) return;
    cities.filter(c => c.state === s.state).forEach(c => {
      const ck = s.state + '|' + c.city, cOpen = DASH.expC.has(ck);
      rows.push(html`<tr class="click geo-row geo-2" data-act="dash-toggle-city" data-k="${ck}">
        <td><span class="chev">${cOpen ? '▾' : '▸'}</span> ${c.city} <span class="small muted">· ${c.clinicCount}</span></td>
        <td class="num">${c.leads}</td><td class="num">${c.testDone}</td><td class="num">${c.conversion === null ? '—' : c.conversion + '%'}</td><td class="num">—</td><td class="num">—</td><td class="num">${inr(c.margin)}</td></tr>`);
      if (!cOpen) return;
      clinics.filter(x => x.state === s.state && x.city === c.city).forEach(cl => rows.push(html`<tr class="geo-3">
        <td class="small">${cl.name}</td><td class="num">${cl.leads}</td><td class="num">${cl.testDone}</td><td class="num">${cl.conversion === null ? '—' : cl.conversion + '%'}</td>
        <td class="num">${cl.adoption === null ? '—' : cl.adoption + '%'}</td><td class="num">${cl.doctors}</td><td class="num">${inr(cl.margin)}</td></tr>`));
    });
  });
  return html`<div class="tblwrap"><table class="tbl"><tr><th>State / city / clinic</th><th class="num">Leads</th><th class="num">Test done</th><th class="num">Conversion</th><th class="num">Adoption</th><th class="num">Doctors</th><th class="num">Margin</th></tr>${rows}</table></div>`;
}
ACT['dash-toggle-state'] = el => { const k = el.dataset.k; DASH.expS.has(k) ? DASH.expS.delete(k) : DASH.expS.add(k); $('#dash-clinics').innerHTML = clinicsTree(DASH.data).s; };
ACT['dash-toggle-city'] = el => { const k = el.dataset.k; DASH.expC.has(k) ? DASH.expC.delete(k) : DASH.expC.add(k); $('#dash-clinics').innerHTML = clinicsTree(DASH.data).s; };
function scoreTable(rows, margin) {
  return html`<div class="tblwrap"><table class="tbl"><tr><th>Name</th><th class="num">Leads</th><th class="num">Test done</th><th class="num">Conversion</th><th class="num">Median report TAT</th><th>Top cancellation reasons</th><th class="num">CSAT</th>${margin ? html`<th class="num">Margin</th>` : ''}</tr>
    ${rows.map(r => html`<tr><td>${r.name}</td><td class="num">${r.leads}</td><td class="num">${r.testDone}</td><td class="num">${r.conversion === null ? '—' : r.conversion + '%'}</td>
    <td class="num">${r.medianReportTatH === null ? '—' : r.medianReportTatH + ' h'}</td><td class="small">${r.cancellations.map(c => c.reason + ' (' + c.count + ')').join(', ')}</td>
    <td class="num">${r.csat === null ? '—' : r.csat + '/5'}</td>${margin ? html`<td class="num">${inr(r.margin)}</td>` : ''}</tr>`)}</table></div>`;
}

        ${r.rows.map(a => html`<tr><td class="small mono">${a.AuditID}<br>${a.Timestamp}</td><td class="small">${a.UserEmail}<br><span class="muted">${a.Role}</span></td><td class="small"><b>${a.Action}</b></td><td class="mono small">${a.LeadID}</td><td class="small">${a.Entity} ${a.EntityRef}</td>
        <td class="small">${a.Note}${a.BeforeJSON || a.AfterJSON ? html`<details><summary>JSON</summary><pre class="json">${a.BeforeJSON}\n→ ${a.AfterJSON}</pre></details>` : ''}</td></tr>`)}</table></div>`.s; } catch (e) { fail(e); }
  };
  $('#au').onsubmit = e => { e.preventDefault(); runA(); };
  runA();
};
ACT['au-export'] = async () => { try { const r = await api('export.table', { table: 'Audit' }); downloadText(r.fileName, r.csv); } catch (e) { fail(e); } };

/* ======================= CONFIG ======================= */
VIEWS.config = async main => {
  main.innerHTML = html`<h2 style="margin-bottom:10px">Configuration</h2><div id="cf"><div class="card empty">Loading…</div></div>`.s;
  const c = await api('config.view', {});
  $('#cf').innerHTML = html`<div class="grid g2"><div class="card col"><h3>Web app</h3><dl class="kv"><dt>App URL</dt><dd class="small mono">${c.appUrl || 'Not deployed yet'}</dd>
      <dt>Triggers</dt><dd class="small">${c.triggers.join(', ') || html`<span style="color:var(--bad)">none — run "Re-install scheduled triggers" from the sheet menu</span>`}</dd>
      <dt>Reports folder</dt><dd class="small mono">${c.reportsFolder}</dd><dt>Backups folder</dt><dd class="small mono">${c.backupsFolder}</dd></dl></div>
    <form class="card col" id="cf-api"><h3>WhatsApp / SMS API (for MSG_MODE = API)</h3><p class="small muted">Credentials are stored in Script Properties, not in the sheet.</p>
      <label class="f"><span>Provider endpoint (https)</span><input type="text" name="url" placeholder="https:\/\/…"></label><label class="f"><span>API token</span><input type="password" name="token" placeholder="${c.apiConfigured ? '•••••• (set)' : ''}"></label>
      <label class="f"><span>Inbound webhook URL (give to your provider)</span><input type="text" readonly value="${c.webhookUrl}"></label>
      <label class="check"><input type="checkbox" name="rotateWebhookKey"> Rotate webhook key</label><button class="btn">Save API settings</button></form></div>
    <div class="card col section"><h3>Exports (Admin only)</h3><div class="actions">${['Leads', 'LeadTests', 'Statements', 'StatementLines', 'Transfers', 'Allocations', 'Messages', 'Reports', 'DuplicateReviews'].map(t => html`<button class="btn btn-sm btn-ghost" data-act="cf-exp" data-t="${t}">${t}</button>`)}</div></div>
    <form class="card col section" id="cf-erase"><h3>Erase a patient's data (DPDP request)</h3>
      <p class="small muted">Removes the patient's name, mobile, spouse name and collection address from every lead for that number, here and in the message log. Lead IDs, dates, status, clinic, partner and amounts stay, so KPI and commission figures are unaffected. Diagnostic report PDFs are not deleted — decide those separately. This cannot be undone.</p>
      <div class="row"><input type="tel" name="phone" placeholder="10-digit mobile" maxlength="10" required style="width:200px">
      <input type="text" name="note" placeholder="Reference (optional)" style="flex:1;min-width:160px">
      <label class="check"><input type="checkbox" name="confirmOpen"> Erase even if leads are still in progress</label>
      <button class="btn btn-ghost">Erase</button></div></form>
    <div class="card section"><h3>Config tab</h3><p class="small muted">SLA targets, KPI targets and workflow switches. Changes apply on the next request and are audit-logged.</p><div class="tblwrap" style="margin-top:8px"><table class="tbl"><tr><th>Key</th><th>Value</th><th>Description</th><th></th></tr>
      ${c.rows.map(r => html`<tr><td class="mono small">${r.Key}</td><td><input type="text" value="${r.Value}" data-key="${r.Key}" class="cf-v" ${r.Key === 'APP_VERSION' ? raw('readonly') : ''}></td><td class="small">${r.Description}</td><td><button class="btn btn-sm btn-ghost" data-act="cf-save" data-key="${r.Key}">Save</button></td></tr>`)}</table></div></div>`.s;
  $('#cf-api').onsubmit = async e => { e.preventDefault(); try { await api('config.msgApi', formData(e.target)); toast('Saved', 'ok'); go('config'); } catch (err) { fail(err); } };
  $('#cf-erase').onsubmit = async e => {
    e.preventDefault();
    const f = formData(e.target);
    if (!await confirmBox('Erase patient data for ' + f.phone + '? This cannot be undone.', 'Erase')) return;
    try { const r = await api('privacy.erasePatient', f); toast('Erased across ' + r.erased + ' lead(s): ' + r.leadIds.join(', '), 'ok'); e.target.reset(); } catch (err) { fail(err); }
  };
};
ACT['cf-save'] = async el => {
  const input = $('.cf-v[data-key="' + el.dataset.key + '"]');
  try { await api('md.save', { table: 'Config', row: { Key: el.dataset.key, Value: input.value }, note: 'Config edit' }); toast(el.dataset.key + ' saved', 'ok'); S.boot = await api('boot', {}, { silent: true }); } catch (e) { fail(e); }
};
ACT['cf-exp'] = async el => { try { const r = await api('export.table', { table: el.dataset.t }); downloadText(r.fileName, r.csv); } catch (e) { fail(e); } };
